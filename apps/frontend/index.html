<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MailPilot — an AI assistant for your Gmail inbox." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%234f46e5'/><stop offset='1' stop-color='%237c3aed'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><path d='M23 9 14 18M23 9l-6 15-3-6-6-3z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem("mailpilot.theme");
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : "system";
      } catch (e) {}
    </script>
    <title>MailPilot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
